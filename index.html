function doRate(i){const d=drugs[i], dose=n(document.getElementById("r"+i).value);if(!dose){return}
 let mlh;
 if(d.calc.mode==="weight_rate"){const w=n(document.getElementById("w"+i).value);if(!w)return;const ugmin=w*dose;mlh=ugmin/d.calc.factor;document.getElementById("res"+i).innerHTML=`<div class="result">${fmt(ugmin)} µg/min → ${fmt(mlh)} ml/h</div>`;}
 else {mlh=dose/d.calc.factor*60;document.getElementById("res"+i).innerHTML=`<div class="result">${fmt(mlh)} ml/h</div>`;}
}
function doBolus(i){const d=drugs[i],w=n(document.getElementById("w"+i).value),dose=n(document.getElementById("r"+i).value);if(!w||!dose)return;const mg=w*dose;const ml=mg/d.calc.factor;document.getElementById("res"+i).innerHTML=`<div class="result">${fmt(mg)} mg → ${fmt(ml)} ml</div>`;}
function fmt(x){return (Math.round(x*100)/100).toLocaleString("it-IT",{maximumFractionDigits:2});}
function persist(){localStorage.setItem(KEY,JSON.stringify(drugs));render()}
function editDrug(i){const d=drugs[i];idx.value=i;dlgTitle.textContent="Modifica farmaco";["name","dose","indicazioni","controindicazioni","preparazione"].forEach(k=>document.getElementById(k).value=d[k]||"");dlg.showModal()}
function addDrug(){idx.value=-1;dlgTitle.textContent="Nuovo farmaco";["name","dose","indicazioni","controindicazioni","preparazione"].forEach(k=>document.getElementById(k).value="");dlg.showModal()}
function saveDrug(){const i=+idx.value,d={name:name.value,dose:dose.value,indicazioni:indicazioni.value,controindicazioni:controindicazioni.value,preparazione:preparazione.value,calc:{mode:"manual"}};if(i<0)drugs.push(d);else{d.calc=drugs[i].calc||{mode:"manual"};drugs[i]=d}persist()}
function delDrug(i){if(confirm("Eliminare questo farmaco?")){drugs.splice(i,1);persist()}}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(drugs,null,2)],{type:"application/json"}));a.download="bignami_farmaci.json";a.click()}
function resetData(){if(confirm("Ripristinare i dati iniziali?")){drugs=structuredClone(initial);persist()}}
search.addEventListener("input",render);render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js");
</script></body></html>
