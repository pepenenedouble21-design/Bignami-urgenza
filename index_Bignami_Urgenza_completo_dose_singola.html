<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bignami Urgenza — Calcoli verificati dal PDF</title>
<meta name="theme-color" content="#ffffff">
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;margin:0;background:#f4f5f7;color:#18212a;padding-bottom:30px}
header{position:sticky;top:0;z-index:5;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 1px 7px #0002}
h1{font-size:21px;margin:0 0 5px}.sub{font-size:12px;color:#69747e;margin-bottom:10px}
input,textarea{font:inherit;border:1px solid #cdd4da;border-radius:11px;padding:11px;width:100%;background:#fff}
main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #0001}
h2{font-size:18px;margin:0 0 8px}.label{font-size:11px;text-transform:uppercase;font-weight:800;color:#68737d;margin-top:10px}.value{line-height:1.4;margin-top:3px}
.prep{background:#eef6ff;border-left:4px solid #2f75b5;padding:10px;border-radius:8px;margin-top:4px}
button{border:0;border-radius:10px;padding:10px 12px;margin:4px 4px 0 0;font-weight:600;background:#e9edf1}.primary{background:#1769d2;color:#fff}
.single-dose{border-left:4px solid #1769d2}.calc{background:#f7fafc;border:1px solid #d9e0e6;border-radius:12px;padding:12px;margin-top:12px}
.result{font-size:22px;font-weight:800;margin-top:8px}.warn{color:#9a3a00;background:#fff3e8;padding:9px;border-radius:8px;margin-top:8px;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar{display:flex;gap:5px;flex-wrap:wrap}
.empty{text-align:center;color:#667;padding:30px}.source{font-size:11px;color:#68737d;margin-top:10px}
dialog{border:0;border-radius:16px;width:min(700px,94%);padding:0;box-shadow:0 10px 60px #0005}
dialog form{padding:18px}dialog label{display:block;font-size:13px;font-weight:700;margin-top:10px}
dialog textarea{resize:vertical}select{font:inherit;border:1px solid #cdd4da;border-radius:11px;padding:11px;width:100%;background:#fff}
input[type=checkbox]{width:auto;margin-right:7px}
.small{font-size:12px;color:#68737d}
</style>
</head>
<body>
<header>
<h1>🚑 Bignami Farmaci — Urgenza</h1>
<div class="sub">Dati e preparazioni riportati dal PDF fornito. Il calcolatore mostra direttamente il risultato in mL/h.</div>
<input id="search" placeholder="🔎 Cerca farmaco, indicazione, preparazione…">
<div class="toolbar" id="audienceBar">
<button id="btnAdult" class="primary" onclick="setAudience('adult')">👨 Adulto</button>
<button id="btnPed" onclick="setAudience('pediatric')">👶 Pediatrico</button>
<button id="btnAll" onclick="setAudience('all')">📋 Tutti</button>
</div>
<div class="toolbar">
<button class="primary" onclick="addDrug()">＋ Nuovo farmaco</button>
<button onclick="resetData()">↻ Ripristina dati fonte</button>
</div>
</header>
<main id="list"></main>

<dialog id="dlg">
<form method="dialog" onsubmit="saveDrug(event)">
<h2 id="dlgTitle">Nuovo farmaco</h2>
<input type="hidden" id="idx">
<label>Nome<input id="fName" required></label>
<label>Destinazione
<select id="fAudience">
<option value="adult">👨 Adulto</option>
<option value="pediatric">👶 Pediatrico</option>
<option value="both">👨 + 👶 Adulto e pediatrico</option>
</select></label>
<label>Dose<textarea id="fDose" rows="3"></textarea></label>
<label>Indicazioni<textarea id="fInd" rows="3"></textarea></label>
<label>Controindicazioni<textarea id="fContra" rows="3"></textarea></label>
<label>Preparazione / concentrazione<textarea id="fPrep" rows="4"></textarea></label>

<div class="calc">
<b>🧮 Calcolatore (facoltativo)</b>
<div class="small">Attivalo solo se dose, unità e concentrazione sono note e coerenti.</div>
<label><input type="checkbox" id="fCalc" onchange="toggleCalc()"> Abilita calcolo automatico</label>
<div id="calcFields" hidden>
<label>Tipo
<select id="fMode" onchange="toggleMode()">
<option value="weight_rate">Infusione: dose per peso → mL/h</option>
<option value="rate">Infusione: dose assoluta → mL/h</option>
<option value="dose_weight">Dose singola: dose per peso → dose totale</option>
</select></label>
<label>Unità dose
<select id="fUnit">
<option value="µg/kg/min">µg/kg/min</option>
<option value="mg/kg/h">mg/kg/h</option>
<option value="µg/min">µg/min</option>
<option value="mg/min">mg/min</option>
</select></label>
<label>Concentrazione<input id="fFactor" type="number" step="any" inputmode="decimal" placeholder="es. 4"></label>
<div class="small" id="factorHint">Inserisci la concentrazione in µg/ml.</div>
</div>
</div>

<div class="toolbar">
<button value="cancel">Annulla</button>
<button class="primary" value="default">Salva farmaco</button>
</div>
</form>
</dialog>

<script>
const initial=[{"name":"Acido tranexamico","dose":"1 g in 10 min → poi 1 g nelle successive 8 h","indicazioni":"Trauma con rischio di importante sanguinamento entro 3 h; emorragia gastrica; ostetrico-ginecologica.","controindicazioni":"Insufficienza renale e ostruzione ureterale.","preparazione":"1 fiala in 250 ml NaCl → 30 ml/h per la fase successiva.","calc":{"mode":"fixed","result":"30 ml/h"}},{"name":"Alteplase","dose":"Varia secondo indicazione.","indicazioni":"IMA, TEP, ictus ischemico.","controindicazioni":"Condizioni predisponenti a sanguinamento cerebrale.","preparazione":"2 flaconi in 100 ml → 1 mg/ml. IMA >65 kg: 15 mg bolo → 50 mg/30 min (100 ml/h) → 35 mg/60 min (35 ml/h). TEP massiva >65 kg: 10 mg bolo → 90 mg/2 h (45 ml/h).","calc":{"mode":"manual"}},{"name":"Adrenalina","dose":"IM 0,01 mg/kg; aerosol 0,25–0,5 mg/kg; infusione 0,01–0,1 µg/kg/min, max 1 µg/kg/min.","indicazioni":"Secondo scenario d’emergenza.","controindicazioni":"","preparazione":"1 fiala in 250 ml → 1 ml = 4 µg. Pompa: 3 mg in 50 ml; relazione ml/h ÷ peso = µg/kg/min.","calc":{"mode":"weight_rate","unit":"µg/kg/min","factor":4,"label":"1 fiala in 250 ml → 4 µg/ml"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Il PDF riporta per somministrazione IM 0,01 mg/kg e per aerosol 0,25–0,5 mg/kg."}},{"name":"Amiodarone","dose":"Carico 5 mg/kg → 1 mg/min per 6 h → 0,5 mg/min per 18 h.","indicazioni":"WPW; flutter/FA selezionata; tachiaritmie sopraventricolari; TV/FV.","controindicazioni":"Ipersensibilità; ipersensibilità allo iodio; gravidanza.","preparazione":"1–2 fiale in 100 ml glucosata 5% → 10–30 min. Poi 250 mg in 250 ml glucosata 5%: 60 ml/h = 1 mg/min; 30 ml/h = 0,5 mg/min.","calc":{"mode":"manual"}},{"name":"Dopamina","dose":">10 µg/kg/min per effetto pressorio; max 40 µg/kg/min.","indicazioni":"Shock di varia natura.","controindicazioni":"Feocromocitoma, ipertiroidismo.","preparazione":"1 fiala in 250 ml fisiologica. Formula: ml/h = µg/min × peso × 0,075. Esempio 70 kg, 15 µg/kg/min → 78 ml/h.","calc":{"mode":"weight_rate","unit":"µg/kg/min","factor":800,"label":"1 fiala in 250 ml fisiologica → 800 µg/ml. Il PDF riporta: ml/h = µg/min × peso × 0,075."}},{"name":"Dobutamina","dose":"Iniziare 2,5 µg/kg/min; titolare; raramente >10; max 40 µg/kg/min.","indicazioni":"Soprattutto shock cardiogeno.","controindicazioni":"Tachicardie, ipovolemia, allergia al sodio metabisolfito.","preparazione":"1 fiala in 250 ml fisiologica. Formula: ml/h = µg/min × peso × 0,06. 70 kg a 5 µg/kg/min → 21 ml/h.","calc":{"mode":"weight_rate","unit":"µg/kg/min","factor":1000,"label":"1 fiala in 250 ml fisiologica → 1000 µg/ml. Il PDF riporta: ml/h = µg/min × peso × 0,06."}},{"name":"Eparina sodica","dose":"60–100 UI/kg. SCA: 12 UI/kg/h; TEP: 18 UI/kg/h.","indicazioni":"FA/flutter, cardioversione, SCA, TEP.","controindicazioni":"Grave trombocitopenia/diatesi emorragica; gravi patologie epatiche e renali.","preparazione":"10.000 UI (2 ml) in 250 ml. Formula: 18 (o 12) × peso / 40 = ml/h. Antidoto: protamina 1 mg/100 UI eparina.","calc":{"mode":"weight_rate","unit":"UI/kg/h","factor":1,"label":"Formula del PDF: 18 (TEP) o 12 (SCA) × peso / 40 = ml/h","custom":"heparin"}},{"name":"Furosemide","dose":"0,5–1,5 mg/kg; max 1000 mg/die. Infusione 0,1–0,4 mg/kg/h.","indicazioni":"Scompenso cardiaco, edema polmonare acuto, ipertensione endocranica.","controindicazioni":"Ipovolemia, ipokaliemia, allattamento, I trimestre gravidanza.","preparazione":"5 fiale in 100 ml NaCl → 10–30 ml/h nel paziente di 70 kg.","calc":{"mode":"weight_rate","unit":"mg/kg/h","factor":0.5,"label":"5 fiale in 100 ml NaCl → 0,5 mg/ml"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Dose: 0,5–1,5 mg/kg. L’infusione 0,1–0,4 mg/kg/h resta nel calcolatore di infusione."}},{"name":"Ketamina","dose":"Analgesia: 0,2–0,3 mg/kg bolo lento → 0,2 mg/kg/h. Induzione: 2 mg/kg → 1 mg/kg/h.","indicazioni":"Sedazione/analgesia nelle procedure.","controindicazioni":"Ipertensione, cardiopatia grave, tachicardia.","preparazione":"1 fiala in 100 ml fisiologica → 1 ml = 1 mg; 70 kg: 15 ml bolo → 20 ml/h. Induzione: stessa concentrazione; 70 kg → 70 ml/h.","calc":{"mode":"weight_rate","unit":"mg/kg/h","factor":1,"label":"1 fiala in 100 ml fisiologica → 1 mg/ml"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Bolo analgesia 0,2–0,3 mg/kg; induzione 2 mg/kg."}},{"name":"Lidocaina","dose":"1,5 mg/kg → infusione 20–50 µg/kg/min.","indicazioni":"TV, FV/TV senza polso; dolore EV; premedicazione IOT in asmatico/trauma cranico.","controindicazioni":"Ipersensibilità agli anestetici locali amidici; gravidanza; <4 anni.","preparazione":"100 mg in 100 ml glucosata 5% → 60–240 ml/h nell’adulto di 70 kg.","calc":{"mode":"weight_rate","unit":"µg/kg/min","factor":1000,"label":"100 mg in 100 ml glucosata 5% → 1 mg/ml = 1000 µg/ml"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Bolo: 1,5 mg/kg. L’infusione resta nel calcolatore di velocità."}},{"name":"Midazolam","dose":"Ansiolisi 0,05 mg/kg; sedazione 0,1–0,15 mg/kg; induzione 0,2–0,3 mg/kg; mantenimento 0,1–0,2 mg/kg/h.","indicazioni":"Ansiolisi, sedazione, induzione, anticonvulsivante.","controindicazioni":"Ipersensibilità; grave insufficienza respiratoria; abuso etilico.","preparazione":"Ansiolisi 1 ml portato a 5 ml → 1 mg/ml. Sedazione 3 ml portati a 15 ml → 1 mg/ml. Mantenimento: 5 ml (25 mg) in 250 ml fisiologica; velocità in ml/h pari al peso.","calc":{"mode":"weight_rate","unit":"mg/kg/h","factor":0.1,"label":"Mantenimento: 5 ml (25 mg) in 250 ml fisiologica; velocità in ml/h pari al peso.","custom":"midazolam"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Ansiolisi 0,05 mg/kg; sedazione 0,1–0,15 mg/kg; induzione 0,2–0,3 mg/kg."}},{"name":"Nitroglicerina","dose":"0,2–1 µg/kg/min; 5–400 µg/min.","indicazioni":"SCA con PAS >150 mmHg; crisi ipertensiva; edema polmonare.","controindicazioni":"PDE-5 nelle 24 h precedenti; ipotensione, shock, CM ipertrofica ostruttiva, ipovolemia, tamponamento cardiaco.","preparazione":"2 fiale in 100 ml NaCl → 1 ml = 100 µg. 10 µg/min → 6 ml/h; 100 µg/min → 60 ml/h; 400 µg/min → 240 ml/h.","calc":{"mode":"rate","unit":"µg/min","factor":100,"label":"2 fiale in 100 ml NaCl → 100 µg/ml"}},{"name":"Noradrenalina","dose":"0,01–1 µg/kg/min; partenza 0,1 µg/kg/min, incrementi di 0,1 ogni 3–5 min.","indicazioni":"Supporto vasopressorio secondo scenario.","controindicazioni":"Ipersensibilità; ipotensione da ipovolemia; ipertensione; angina di Prinzmetal.","preparazione":"1 fiala in 250 ml SG5% o fisiologica → 1 ml = 8 µg. Monitorare il sito periferico per stravaso.","calc":{"mode":"weight_rate","unit":"µg/kg/min","factor":8,"label":"1 fiala in 250 ml → 8 µg/ml"}},{"name":"Propofol","dose":"Induzione 1–2,5 mg/kg; mantenimento 2–10 mg/kg/h.","indicazioni":"Sedazione/induzione anestesia.","controindicazioni":"Ipersensibilità; allergia ad arachidi/soia secondo PDF.","preparazione":"3 fiale (60 ml) in 250 ml, togliendo prima 60 ml dalla sacca → 1 ml = 2,4 mg. Velocità = peso per 2,5 mg/kg/h; 2× = 5 mg/kg/h; 3× = 7,5 mg/kg/h.","calc":{"mode":"weight_rate","unit":"mg/kg/h","factor":2.4,"label":"1 ml = 2,4 mg"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Induzione: 1–2,5 mg/kg. Il mantenimento è espresso in mg/kg/h e resta nel calcolatore di infusione."}},{"name":"Salbutamolo","dose":"EV: 100–250 µg; iniziale 5 µg/min, max 20 µg/min. Aerosol: 5–10 mg.","indicazioni":"Broncospasmo nell’asma/BPCO; iperkaliemia.","controindicazioni":"Ipersensibilità.","preparazione":"2 fiale da 500 µg in 100 ml NaCl → 30 ml/h, max 120 ml/h.","calc":{"mode":"rate","unit":"µg/min","factor":10,"label":"2 fiale da 500 µg in 100 ml NaCl → 10 µg/ml"}},{"name":"Isoprenalina","dose":"2–10 µg/min, titolare.","indicazioni":"BAV totale; broncospasmo.","controindicazioni":"Ipersensibilità al sodio metabisolfito; tachicardia; bradicardia da intossicazione digitalica.","preparazione":"2 fiale in 100 ml fisiologica → 1 ml = 4 µg. Partire da 60 ml/h e titolare.","calc":{"mode":"rate","unit":"µg/min","factor":4,"label":"2 fiale in 100 ml → 4 µg/ml"}},{"name":"Acetilsalicilato di lisina","dose":"250 mg EV nella SCA; 500 mg come antinfiammatorio/analgesico/antipiretico.","indicazioni":"SCA; dolore, infiammazione, febbre.","controindicazioni":"Allergia all’ASA; insufficienza renale grave.","preparazione":"Fiale 500/1000 mg. Preparazione non specificata nel PDF.","calc":{"mode":"manual"}},{"name":"Adenosina","dose":"0,1 mg/kg EV.","indicazioni":"AVNRT, AVRT; supporto diagnostico nelle tachicardie sopraventricolari a QRS stretto/largo.","controindicazioni":"FA/flutter con via accessoria nota; asma; QT lungo.","preparazione":"Fiale 6 mg/2 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"0,1 mg/kg EV."}},{"name":"Atropina","dose":"Bradicardia 1 mg EV ogni 3–5 min, max 3 mg; organofosforici 2 mg IM/EV ogni 5–10 min fino a risposta.","indicazioni":"Bradicardia sinusale, BAV I grado, organofosforici; premedicazione selezionata.","controindicazioni":"Ipersensibilità; glaucoma ad angolo chiuso; BAV II Mobitz II; BAV III grado.","preparazione":"Fiale 0,5/1 mg/ml. Preparazione non specificata.","calc":{"mode":"manual"}},{"name":"Betametasone","dose":"0,1–0,2 mg/kg.","indicazioni":"Reazioni anafilattiche/allergiche, edema laringeo, asma, edema cerebrale.","controindicazioni":"Allergia nota.","preparazione":"Fiale 4 mg/2 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"0,1–0,2 mg/kg."}},{"name":"Bicarbonato di sodio","dose":"1 mEq/kg; 1 ml = 1 mEq, ripetibile secondo risposta.","indicazioni":"Intossicazione da salicilati, triciclici/altri bloccanti Na, iponatriemia, iperkaliemia.","controindicazioni":"Alcalosi, ipocalcemia, ipokaliemia, ventilazione inadeguata.","preparazione":"Fiale 10 ml 8,4%. Preparazione non specificata.","calc":{"mode":"manual"}},{"name":"Calcio gluconato","dose":"Iperkaliemia 2–3 fiale, ripetibili in base all’ECG; altre indicazioni 20–30 mg/kg (0,3 ml/kg).","indicazioni":"Ipocalcemia, iperkaliemia, intossicazione da Mg, sovradosaggio calcio-antagonisti.","controindicazioni":"Non specificate nel PDF.","preparazione":"Fiale 10 ml al 10%. Attenzione al bolo rapido.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Il PDF riporta 20–30 mg/kg (0,3 ml/kg) per alcune indicazioni."}},{"name":"Cefazolina","dose":"2 g EV; bambino 30 mg/kg.","indicazioni":"Profilassi antibiotica nella frattura esposta.","controindicazioni":"Ipersensibilità a cefazolina, penicilline, cefalosporine/beta-lattamici.","preparazione":"Fiala 1 g + 4 ml diluente per IM. Per EV non utilizzare il liquido di diluizione presente nella confezione.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Nel bambino: 30 mg/kg."}},{"name":"Clorfenamina","dose":"10 mg EV/IM; bambino 0,25 mg/kg.","indicazioni":"Reazioni allergiche.","controindicazioni":"IMAO, III trimestre gravidanza, glaucoma ad angolo chiuso, asma.","preparazione":"Fiala 10 mg/1 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Nel bambino: 0,25 mg/kg."}},{"name":"Diazepam","dose":"Ansia 0,04–0,2 mg/kg; stato epilettico 0,3–0,4 mg/kg; spasmi 0,1–0,2 mg/kg.","indicazioni":"Agitazione, stato epilettico, spasmi muscolari, tetano.","controindicazioni":"Ipersensibilità, gravidanza I/III trimestre, allattamento, miastenia grave.","preparazione":"Fiale 10 mg/2 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Il PDF riporta: ansia 0,04–0,2 mg/kg; stato epilettico 0,3–0,4 mg/kg; spasmi 0,1–0,2 mg/kg."}},{"name":"Digossina","dose":"Carico parenterale 0,5–1 mg; ½ subito, ¼ dopo 4 h, ¼ dopo altre 4 h.","indicazioni":"FA con FE fortemente ridotta per controllo frequenza/inotropismo.","controindicazioni":"Vie accessorie/WPW, tachicardie ventricolari, cardiomiopatia ipertrofica ostruttiva, bradicardia, BAV.","preparazione":"Fiale 0,5 mg/2 ml. Esempio: 1 fiala da 0,5 mg lenta.","calc":{"mode":"manual"}},{"name":"Esmololo","dose":"FV recidivante 500 µg/kg bolo + 50–100 µg/kg/min; altre patologie 0,5 mg/kg poi 0,10–0,20 mg/kg/min.","indicazioni":"Storm aritmico/FV-TV recidivanti.","controindicazioni":"Bradicardia, BAV, ipotensione, shock cardiogeno, asma grave.","preparazione":"2 fiale in 100 ml a 100 ml/h = 50 µg/kg/min nel soggetto di 70 kg.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"µg/kg","label":"Il PDF riporta un bolo di 500 µg/kg per FV recidivante. Le altre dosi/kg riportate sono per infusione e restano nel testo."}},{"name":"Fentanyl","dose":"2–8 µg/kg bolo; infusione 0,7–2 µg/kg/h.","indicazioni":"Analgesia potente e breve nel paziente emodinamicamente stabile.","controindicazioni":"Bradicardia, ipotensione, grave insufficienza renale/epatica.","preparazione":"Fiale 100 µg/2 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"µg/kg","label":"Bolo: 2–8 µg/kg."}},{"name":"Flumazenil","dose":"Usualmente 0,3–0,6 mg.","indicazioni":"Sovradosaggio da benzodiazepine.","controindicazioni":"Ipersensibilità; intossicazione mista, soprattutto triciclici.","preparazione":"Fiale 1 mg/10 ml = 0,1 mg/ml. Preparazione non specificata.","calc":{"mode":"manual"}},{"name":"Glucagone","dose":"Ipoglicemia 1–2 mg IM; beta-bloccanti 50 µg/kg fino a 10 mg → 2–10 mg/h.","indicazioni":"Coma ipoglicemico senza accesso venoso; intossicazione beta-bloccanti; bradicardia in beta-bloccato.","controindicazioni":"Feocromocitoma; riserve di glicogeno esaurite.","preparazione":"Fiala 1 mg. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"µg/kg","label":"Beta-bloccanti: 50 µg/kg fino a 10 mg."}},{"name":"Levetiracetam","dose":"15–30 mg/kg in 15–30 min.","indicazioni":"Seconda linea nello stato epilettico dopo fallimento BDZ.","controindicazioni":"Allergia nota.","preparazione":"Fiale 500 mg/5 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"15–30 mg/kg in 15–30 min."}},{"name":"Magnesio solfato","dose":"Eclampsia 4 g carico → 1 g/h; asma 40–100 mg/kg; torsione di punta 2–4 g EV in 30–60 s.","indicazioni":"Eclampsia, asma, BPCO, FA, crisi ipertensiva, intossicazione digitalica, iperkaliemia, torsione di punta.","controindicazioni":"Ipersensibilità; grave compromissione renale.","preparazione":"2 g in 100 ml fisiologica in 20 min (esempio riportato nel PDF).","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Asma: 40–100 mg/kg. Le altre dosi del PDF sono espresse in grammi."}},{"name":"Metilprednisone","dose":"5–30 mg/kg in bolo lento; alte dosi in almeno 30 min.","indicazioni":"Reazione allergica grave, emesi da chemioterapia, asma.","controindicazioni":"Ipersensibilità; infezioni micotiche.","preparazione":"Polvere 1 g. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"5–30 mg/kg in bolo lento."}},{"name":"Metoprololo","dose":"Fino a 5 mg EV lentamente, 1–2 mg/min; ripetibile ogni 5 min; difficilmente >15 mg.","indicazioni":"Tachiaritmie sopraventricolari; SCA.","controindicazioni":"Bradicardia, ipotensione, BAV, edema polmonare, asma grave, Raynaud severo, shock cardiogeno.","preparazione":"Fiale 5 mg/5 ml. Preparazione non specificata.","calc":{"mode":"manual"}},{"name":"Morfina","dose":"40–100 µg/kg secondo risposta; infusione 20–40 mg/24 h.","indicazioni":"Dolore moderato/grave.","controindicazioni":"Gravidanza, allattamento, abuso etilico.","preparazione":"Fiala 10 mg/1 ml. Nota PDF: non più indicata nella SCA; peggiora l’outcome nell’edema polmonare.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"µg/kg","label":"40–100 µg/kg secondo risposta."}},{"name":"Naloxone","dose":"0,4 mg EV/IM/SC; bambino 0,01 mg/kg; ripetere ogni 2–3 min se necessario.","indicazioni":"Antagonizzazione degli oppioidi.","controindicazioni":"Ipersensibilità.","preparazione":"Fiala 0,4 mg/1 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Nel bambino: 0,01 mg/kg."}},{"name":"Ossitocina","dose":"Prevenzione PPH 10 UI IM; PPH conclamata 10 UI IM → 20 UI EV in 250 ml cristalloidi.","indicazioni":"Induzione/travaglio; emorragia post-partum.","controindicazioni":"Sensibilizzazione al lattice come fattore di rischio per anafilassi; asma.","preparazione":"20 UI in 250 ml cristalloidi per PPH conclamata.","calc":{"mode":"manual"}},{"name":"Rocuronio","dose":"RSI: 1 mg/kg bolo = 1 ml/10 kg. Dopo IOT: 0,6 mg/kg = 1 ml/20 kg. Mantenimento: 0,15 mg/kg; alternativa 0,3 mg/kg/h.","indicazioni":"Paralisi neuromuscolare/intubazione.","controindicazioni":"Ipersensibilità al rocuronio/bromuri/eccipienti.","preparazione":"Fiale 50 mg/5 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"RSI 1 mg/kg; dopo IOT 0,6 mg/kg; mantenimento 0,15 mg/kg. Il PDF riporta anche alternativa 0,3 mg/kg/h."}},{"name":"Sugammadex","dose":"Antagonismo immediato dopo rocuronio → 16 mg/kg.","indicazioni":"Antagonizzazione del blocco neuromuscolare da rocuronio/vecuronio.","controindicazioni":"Ipersensibilità.","preparazione":"Fiale 200 mg/2 ml. Preparazione non specificata.","calc":{"mode":"manual"},"calc_single":{"mode":"dose_weight","unit":"mg/kg","label":"Antagonismo immediato dopo rocuronio: 16 mg/kg."}},{"name":"Tenecteplase / Metalyse","dose":"100 U/kg = 1 ml ogni 10 kg; >75 anni può essere considerato il dimezzamento.","indicazioni":"IMA; il PDF cita anche TEP supportato dalla letteratura.","controindicazioni":"Condizioni predisponenti a sanguinamento cerebrale.","preparazione":"Flacone 10.000 U polvere + solvente.","calc":{"mode":"manual"}},{"name":"Terlipressina","dose":"Iniziale: <50 kg 1 mg; 50–70 kg 1,5 mg; >70 kg 2 mg. Poi 1 mg ogni 4–6 h.","indicazioni":"Varici esofagee sanguinanti.","controindicazioni":"Ipersensibilità.","preparazione":"Fiale 1 mg. Preparazione non specificata.","calc":{"mode":"manual"}},{"name":"Ticagrelor","dose":"180 mg = 2 compresse da 90 mg al primo contatto medico/prima della PCI.","indicazioni":"SCA.","controindicazioni":"Ipersensibilità, sanguinamento attivo, emorragia intracranica pregressa, grave compromissione epatica.","preparazione":"Compresse 90 mg. Nota PDF: non somministrare in trombolisi o nei pazienti in terapia anticoagulante orale; clopidogrel 600 mg come alternativa.","calc":{"mode":"manual"}},{"name":"Urapidil","dose":"Infusione iniziale 2 mg/min, max 30 mg/h; raggiunto l’effetto 5–30 mg/h.","indicazioni":"Emergenze-urgenze ipertensive.","controindicazioni":"Gravidanza, allattamento, stenosi aortica.","preparazione":"1 fiala in 100 ml NaCl → 20 ml/h = 9 mg/h.","calc":{"mode":"manual"}}];
// I dati iniziali vengono classificati in base a quanto esplicitamente indicato nel PDF.
initial.forEach(d=>{
  if(!d.audience){
    const t=(d.dose||"").toLowerCase();
    d.audience=(/bambin|pediatr/.test(t))?"both":"adult";
  }
  // Dose singola solo quando il PDF riporta una dose esplicitamente per kg.
  if(d.calc?.mode==="manual" && /\b(\d+[.,]?\d*|\d+–\d+)\s*(mg|µg|mEq|U|UI)\/kg/.test(d.dose||"")) {
    const m=(d.dose||"").match(/([0-9]+(?:[.,][0-9]+)?)[–-]?([0-9]+(?:[.,][0-9]+)?)?\s*(mg|µg|mEq|U|UI)\/kg/);
    if(m && (m[3]==="mg"||m[3]==="µg")){ d.calc={mode:"single_weight",unit:m[3]+"/kg",label:"Dosaggio per kg riportato nel PDF."}; }
  }
});
const KEY="bignami_urgenza_pdf_v1";
let drugs=JSON.parse(localStorage.getItem(KEY)||"null")||initial;
// Aggiornamento non distruttivo: aggiunge i nuovi calcolatori ai farmaci fonte già salvati, senza cancellare farmaci personali.
if(Array.isArray(drugs) && drugs!==initial){
  drugs=drugs.map(d=>{
    const src=initial.find(x=>x.name===d.name);
    return (src && src.calc_single && !d.calc_single) ? {...d,calc_single:src.calc_single} : d;
  });
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function n(v){return parseFloat(String(v).replace(",","."));}
function fmt(x){return (Math.round(x*100)/100).toLocaleString("it-IT",{maximumFractionDigits:2});}
function doseWeightBox(d,i){
 if(!d.calc_single || d.calc_single.mode!=="dose_weight") return "";
 return `<div class="calc single-dose"><b>💉 Calcola dose singola</b><div class="row">
 <label>Peso (kg)<input id="sw${i}" type="number" step="0.1" inputmode="decimal" placeholder="es. 70"></label>
 <label>Dose (${esc(d.calc_single.unit)})<input id="sd${i}" type="number" step="0.01" inputmode="decimal" placeholder="es. 1"></label>
 </div><button class="primary" onclick="doSingleDose(${i})">Calcola dose</button><div id="sres${i}"></div><div class="small">${esc(d.calc_single.label)}</div></div>`;
}
function doSingleDose(i){
 const d=drugs[i],w=n(document.getElementById("sw"+i).value),dose=n(document.getElementById("sd"+i).value);
 if(!(w>0)||!(dose>0))return;
 const total=w*dose;
 document.getElementById("sres"+i).innerHTML=`<div class="result">${fmt(total)} ${esc(d.calc_single.unit.replace("/kg",""))}</div>`;
}
function defaultDilution(d){
 const u=(d.calc.unit||'').includes('µg')?'µg':'mg';
 const defaults={
  'Adrenalina':[1000,'µg',250], 'Dopamina':[200000,'µg',250], 'Dobutamina':[250000,'µg',250],
  'Eparina sodica':[10000,'UI',250], 'Furosemide':[100,'mg',100], 'Ketamina':[100,'mg',100],
  'Lidocaina':[100,'mg',100], 'Midazolam':[25,'mg',250], 'Nitroglicerina':[10000,'µg',100],
  'Noradrenalina':[2000,'µg',250], 'Propofol':[600,'mg',250], 'Salbutamolo':[1000,'µg',100],
  'Isoprenalina':[400,'µg',100]
 };
 if(defaults[d.name]) return defaults[d.name];
 const vol=250;
 return [d.calc.factor*vol,u,vol];
}
function calcBox(d,i){
 if(!d.calc || d.calc.mode==="manual") return '<div class="warn">Calcolo automatico non impostato: usare dose e preparazione riportate nella fonte.</div>';
 if(d.calc.mode==="fixed") return `<div class="calc"><b>🧮 Risultato fonte</b><div class="result">${esc(d.calc.result)}</div></div>`;
 if(d.calc.mode==="single_weight"){
   return `<div class="calc"><b>💉 Calcola dose singola</b><div class="row">
   <label>Peso (kg)<input id="sw${i}" type="number" step="0.1" inputmode="decimal" placeholder="es. 70"></label>
   <label>Dose (${esc(d.calc.unit)})<input id="sd${i}" type="number" step="0.01" inputmode="decimal" placeholder="es. 1"></label>
   </div><button class="primary" onclick="doSingleWeight(${i})">Calcola</button><div id="sres${i}"></div><div class="small">Solo dose totale: non viene calcolato il volume della fiala.</div></div>`;
 }
 if(d.calc.mode==="weight_rate"){
   return `<div class="calc"><b>🧮 Calcola velocità</b>
   <div class="row"><label>Peso (kg)<input id="w${i}" type="number" step="0.1" inputmode="decimal" placeholder="es. 70"></label>
   <label>Dose (${esc(d.calc.unit)})<input id="r${i}" type="number" step="0.01" inputmode="decimal" placeholder="es. 0,1"></label></div>
   <div class="row"><label>Quantità farmaco<input id="qf${i}" type="number" step="0.01" inputmode="decimal" placeholder="es. 1"></label>
   <label>Unità quantità<select id="qu${i}"><option value="mg">mg</option><option value="µg">µg</option><option value="UI">UI</option></select></label></div>
   <label>Volume diluizione<select id="vol${i}" onchange="updateDilution(${i})"><option value="100">100 mL</option><option value="250" selected>250 mL</option><option value="custom">Personalizzato</option></select></label>
   <label id="cv${i}" hidden>Volume personalizzato (mL)<input id="cvv${i}" type="number" step="1" min="1" inputmode="decimal" placeholder="es. 150"></label>
   <button class="primary" onclick="doWeightRate(${i})">Calcola</button><div id="res${i}"></div><div id="conc${i}" class="small"></div><div class="small">${esc(d.calc.label||"")}</div></div>`;
 }
 if(d.calc.mode==="rate"){
   return `<div class="calc"><b>🧮 Calcola velocità</b>
   <label>Dose (${esc(d.calc.unit)})<input id="r${i}" type="number" step="0.01" inputmode="decimal" placeholder="es. 10"></label>
   <div class="row"><label>Quantità farmaco<input id="qf${i}" type="number" step="0.01" inputmode="decimal" placeholder="es. 1"></label><label>Unità quantità<select id="qu${i}"><option value="mg">mg</option><option value="µg">µg</option><option value="UI">UI</option></select></label></div>
   <label>Volume diluizione<select id="vol${i}" onchange="updateDilution(${i})"><option value="100">100 mL</option><option value="250" selected>250 mL</option><option value="custom">Personalizzato</option></select></label>
   <label id="cv${i}" hidden>Volume personalizzato (mL)<input id="cvv${i}" type="number" step="1" min="1" inputmode="decimal"></label>
   <button class="primary" onclick="doRate(${i})">Calcola</button><div id="res${i}"></div><div id="conc${i}" class="small"></div><div class="small">${esc(d.calc.label||"")}</div></div>`;
 }
}
function updateDilution(i){
 const v=document.getElementById("vol"+i).value;
 document.getElementById("cv"+i).hidden=v!=="custom";
}
function getVolume(i){
 const v=document.getElementById("vol"+i).value;
 if(v==="custom") return n(document.getElementById("cvv"+i).value);
 return n(v);
}
function getConcentration(i,d){
 const q=n(document.getElementById("qf"+i).value), unit=document.getElementById("qu"+i).value, vol=getVolume(i);
 if(!(q>0)||!(vol>0)) return null;
 const factor = unit==="mg" ? (q*1000/vol) : unit==="µg" ? (q/vol) : (q/vol);
 return {value:factor, unit:unit==="mg"?"µg/mL":unit==="µg"?"µg/mL":"UI/mL", vol};
}
function doSingleWeight(i){
 const w=n(document.getElementById("sw"+i).value), dose=n(document.getElementById("sd"+i).value), unit=drugs[i].calc.unit;
 if(!(w>0)||!(dose>0))return;
 document.getElementById("sres"+i).innerHTML=`<div class="result">${fmt(w*dose)} ${esc(unit.replace('/kg',''))}</div>`;
}
function doWeightRate(i){
 const d=drugs[i],w=n(document.getElementById("w"+i).value),dose=n(document.getElementById("r"+i).value);
 if(!(w>0)||!(dose>0))return;
 const c=getConcentration(i,d);
 if(!c){document.getElementById("res"+i).innerHTML='<div class="warn">Inserisci quantità di farmaco e volume di diluizione.</div>';return;}
 let mlh;
 if(d.calc.custom==="heparin"){
   mlh=dose*w/40;
 } else if(d.calc.custom==="midazolam"){
   mlh=w;
 } else {
   const unit=d.calc.unit;
   if(unit==="µg/kg/min") mlh=(w*dose)/c.value*60;
   else if(unit==="µg/kg/h") mlh=(w*dose)/c.value;
   else if(unit==="mg/kg/min") mlh=(w*dose)/(c.value/1000)*60;
   else if(unit==="mg/kg/h") mlh=(w*dose)/(c.value/1000);
   else mlh=(w*dose)/c.value*60;
 }
 document.getElementById("res"+i).innerHTML=`<div class="result">${fmt(mlh)} mL/h</div>`;
 document.getElementById("conc"+i).textContent=`Concentrazione calcolata: ${fmt(c.value)} ${c.unit} con ${fmt(c.vol)} mL di diluente.`;
}
function doRate(i){
 const d=drugs[i],dose=n(document.getElementById("r"+i).value);
 if(!(dose>0))return;
 const c=getConcentration(i,d);
 if(!c){document.getElementById("res"+i).innerHTML='<div class="warn">Inserisci quantità di farmaco e volume di diluizione.</div>';return;}
 let mlh;
 if(d.calc.unit==="µg/min") mlh=dose/c.value*60;
 else if(d.calc.unit==="mg/min") mlh=dose/(c.value/1000)*60;
 else mlh=dose/c.value*60;
 document.getElementById("res"+i).innerHTML=`<div class="result">${fmt(mlh)} mL/h</div>`;
 document.getElementById("conc"+i).textContent=`Concentrazione calcolata: ${fmt(c.value)} ${c.unit} con ${fmt(c.vol)} mL di diluente.`;
}
let audience="adult";
function setAudience(v){ audience=v; document.getElementById("btnAdult").classList.toggle("primary",v==="adult"); document.getElementById("btnPed").classList.toggle("primary",v==="pediatric"); document.getElementById("btnAll").classList.toggle("primary",v==="all"); render(); }
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const a=drugs.map((d,i)=>({...d,i})).filter(d=>{const aud=d.audience||"adult"; const okA=audience==="all"||audience===aud||aud==="both"; return okA && (!q||JSON.stringify(d).toLowerCase().includes(q));});
 document.getElementById("list").innerHTML=a.length?a.map(d=>`<section class="card">
 <h2>${esc(d.name)}</h2>
 <div class="label">Dose</div><div class="value">${esc(d.dose)}</div>
 <div class="label">Indicazioni</div><div class="value">${esc(d.indicazioni)}</div>
 <div class="label">Controindicazioni</div><div class="value">${esc(d.controindicazioni)}</div>
 <div class="label">💉 Preparazione</div><div class="prep">${esc(d.preparazione)}</div>
 ${calcBox(d,d.i)}${doseWeightBox(d,d.i)}
 <div class="toolbar">
   <button onclick="editDrug(${d.i})">✏️ Modifica</button>
   <button onclick="deleteDrug(${d.i})">🗑️ Elimina</button>
 </div>
 <div class="source">Fonte: PDF fornito dall'utente per i dati iniziali.</div>
 </section>`).join(""):'<div class="empty">Nessun risultato.</div>';
}
document.getElementById("search").addEventListener("input",render);

function addDrug(){
  document.getElementById("idx").value="-1";
  document.getElementById("dlgTitle").textContent="Nuovo farmaco";
  ["fName","fDose","fInd","fContra","fPrep"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fCalc").checked=false;
  document.getElementById("fMode").value="weight_rate";
  document.getElementById("fUnit").value="µg/kg/min";
  document.getElementById("fFactor").value="";
  toggleCalc();
  document.getElementById("dlg").showModal();
}
function editDrug(i){
  const d=drugs[i];
  document.getElementById("idx").value=String(i);
  document.getElementById("dlgTitle").textContent="Modifica farmaco";
  document.getElementById("fName").value=d.name||"";
  document.getElementById("fAudience").value=d.audience||"adult";
  document.getElementById("fDose").value=d.dose||"";
  document.getElementById("fInd").value=d.indicazioni||"";
  document.getElementById("fContra").value=d.controindicazioni||"";
  document.getElementById("fPrep").value=d.preparazione||"";
  const c=d.calc&&d.calc.mode&&d.calc.mode!=="manual"&&d.calc.mode!=="fixed";
  document.getElementById("fCalc").checked=!!c;
  document.getElementById("fMode").value=d.calc_single?"dose_weight":(c?d.calc.mode:"weight_rate");
  document.getElementById("fUnit").value=d.calc_single?(d.calc_single.unit||"mg/kg"):(c?(d.calc.unit||"µg/kg/min"):"µg/kg/min");
  document.getElementById("fFactor").value=c&&d.calc.factor!=null?d.calc.factor:"";
  toggleCalc();
  document.getElementById("dlg").showModal();
}
function toggleCalc(){
  const on=document.getElementById("fCalc").checked;
  document.getElementById("calcFields").hidden=!on;
  toggleMode();
}
function toggleMode(){
  const mode=document.getElementById("fMode").value;
  const unit=document.getElementById("fUnit");
  const hint=document.getElementById("factorHint");
  const factor=document.getElementById("fFactor");
  if(mode==="rate"){
    unit.innerHTML='<option value="µg/min">µg/min</option><option value="mg/min">mg/min</option>';
    factor.disabled=false; factor.required=true; hint.textContent=(unit.value.includes("µg") ? "Inserisci la concentrazione in µg/ml." : "Inserisci la concentrazione in mg/ml.");
  }else if(mode==="dose_weight"){
    unit.innerHTML='<option value="µg/kg">µg/kg</option><option value="mg/kg">mg/kg</option>';
    factor.value=""; factor.disabled=true; factor.required=false; hint.textContent="Non serve la concentrazione della fiala: il risultato è la dose totale in µg o mg.";
  }else{
    unit.innerHTML='<option value="µg/kg/min">µg/kg/min</option><option value="mg/kg/h">mg/kg/h</option>';
    factor.disabled=false; factor.required=true; hint.textContent=(unit.value.includes("µg") ? "Inserisci la concentrazione in µg/ml." : "Inserisci la concentrazione in mg/ml.");
  }
}
function saveDrug(e){
  e.preventDefault();
  const name=document.getElementById("fName").value.trim();
  if(!name){alert("Inserisci il nome del farmaco.");return;}
  const d={
    name,
    audience:document.getElementById("fAudience").value,
    dose:document.getElementById("fDose").value.trim(),
    indicazioni:document.getElementById("fInd").value.trim(),
    controindicazioni:document.getElementById("fContra").value.trim(),
    preparazione:document.getElementById("fPrep").value.trim(),
    calc:{mode:"manual"}
  };
  if(document.getElementById("fCalc").checked){
    const mode=document.getElementById("fMode").value;
    const unit=document.getElementById("fUnit").value;
    if(mode==="dose_weight"){
      d.calc={mode:"manual"};
      d.calc_single={mode:"dose_weight",unit,label:"Calcolo dose totale = peso × dose. Non usa la concentrazione della fiala."};
    }else{
      const factor=n(document.getElementById("fFactor").value);
      if(!(factor>0)){alert("Inserisci una concentrazione valida.");return;}
      d.calc={mode,unit,factor,label:`Concentrazione iniziale: ${factor} ${unit.includes("µg")?"µg/ml":"mg/ml"}`,amount:factor*250,amountUnit:unit.includes("µg")?"µg":"mg",dilutionVolume:250};
    }
  }
  const i=Number(document.getElementById("idx").value);
  if(i<0) drugs.push(d); else drugs[i]=d;
  localStorage.setItem(KEY,JSON.stringify(drugs));
  document.getElementById("dlg").close();
  render();
}
function deleteDrug(i){
  if(confirm("Eliminare questo farmaco?")){
    drugs.splice(i,1);
    localStorage.setItem(KEY,JSON.stringify(drugs));
    render();
  }
}

function resetData(){
 if(confirm("Ripristinare i dati del PDF e cancellare i dati salvati localmente?")){
   localStorage.removeItem(KEY);drugs=initial;render();
 }
}
render();
</script>
